filetype: kr

detect:
    filename: "\\.kr$"

# Hangul has no word boundary for the regex engine: keywords match anywhere in a word, so the
# one-syllable ones (값, 개, 빈) are left out, they would light up inside names
rules:
    - identifier: "[a-zA-Z_][a-zA-Z0-9_]*"
    - type: "(정수|소수|논리|문자|바이트|주소|짧은|부호 없는|고정된)"
    - statement: "(외부|반환하는|반환해요|반환|받아|세면서|그만해요|넘어가요|크기)"
    - statement: "(만약|아니면|아닌|동안|그리고|또는)"
    - constant.bool: "(참|거짓)"
    - constant.number: "\\b[0-9]+(\\.[0-9]+)?"
    - symbol.operator: "(<<|>>|<=|>=|==|!=|[-+*/%&|^~<>])"
    - symbol.brackets: "[(){}]"
    - symbol: "(\\.\\.\\.|…|[,.])"

    - constant.string:
        start: "\""
        end: "\""
        skip: "\\\\."
        rules:
            - constant.specialChar: "\\\\[nt0\\\\\"]"

    - comment:
        start: "//"
        end: "$"
        rules: []

    - comment:
        start: "/\\*"
        end: "\\*/"
        rules: []
